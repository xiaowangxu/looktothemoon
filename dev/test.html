<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        position: fixed;
        left: 100px;
        bottom: 200px;
        background-color: antiquewhite;
    }

    .item {
        position: relative;
    }

    .panel {
        position: relative;
        width: 200px;
        height: 40px;
        background-color: rgb(245, 245, 245);
        border-radius: 6px;
        border: rgb(223, 223, 223) solid 1px;
        box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.171);
        display: flex;
    }

    .item > * {
        display: block;
        margin: auto;
    }

    .item > .item {
        position: absolute;
        top: calc(-10px);
        transform: translateY(0) scale(calc(1 - var(--index) * 0.05));
        transition: transform 0.25s ease-out;
    }

    .item:hover .item {
        transform: translateY(-100%) scale(1);
        transition: transform 0.25s ease-out;
    }
</style>

<body>
    <div class="container">
        <div class="item" style="--index: 0;">
            <div class="item" style="--index: 1;">
                <div class="item" style="--index: 2;">
                    <div class="panel">3</div>
                </div>
                <div class="panel">2</div>
            </div>
            <div class="panel">1</div>
        </div>
    </div>
</body>

</html>
